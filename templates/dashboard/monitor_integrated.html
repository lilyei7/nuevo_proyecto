<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📡 Monitor Integrado - Sin Servidores Adicionales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .monitor-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .monitor-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .logs-container {
            background: #1e1e1e;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            height: 500px;
            overflow-y: auto;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }
        
        .log-entry {
            margin: 3px 0;
            padding: 5px 8px;
            border-left: 3px solid #333;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        
        .log-entry:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .log-entry.info { border-color: #17a2b8; }
        .log-entry.success { border-color: #28a745; }
        .log-entry.warning { border-color: #ffc107; }
        .log-entry.error { border-color: #dc3545; }
        .log-entry.debug { border-color: #6c757d; }
        
        .log-timestamp {
            color: #888;
            font-size: 10px;
        }
        
        .log-module {
            color: #ffc107;
            font-weight: bold;
        }
        
        .log-message {
            color: #ffffff;
        }
        
        .controls-panel {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .control-btn {
            margin: 5px;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; }
        .btn-clear { background: #6c757d; color: white; }
        .btn-export { background: #17a2b8; color: white; }
        
        .connection-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .connected { background: #28a745; }
        .disconnected { background: #dc3545; }
        .connecting { background: #ffc107; }
        
        .filter-controls {
            margin: 15px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        
        .activity-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 10px 15px;
            border-radius: 25px;
            color: white;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        
        .activity-active {
            background: #28a745;
            animation: pulse 2s infinite;
        }
        
        .activity-inactive {
            background: #6c757d;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="monitor-container">
        <div class="container-fluid">
            <!-- Header -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="monitor-card p-4">
                        <h1 class="text-center mb-0">📡 Monitor Integrado en Tiempo Real</h1>
                        <p class="text-center text-muted mb-0">
                            Sistema de logs sin servidores adicionales • 
                            <span class="connection-indicator" id="connection-status"></span>
                            <span id="connection-text">Conectando...</span>
                        </p>
                    </div>
                </div>
            </div>
            
            <!-- Statistics Grid -->
            <div class="stats-grid" id="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="total-logs">0</div>
                    <div class="stat-label">Total Logs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="error-count">0</div>
                    <div class="stat-label">Errores</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="success-rate">100%</div>
                    <div class="stat-label">Tasa Éxito</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="last-update">--:--:--</div>
                    <div class="stat-label">Última Act.</div>
                </div>
            </div>
            
            <!-- Controls Panel -->
            <div class="monitor-card">
                <div class="controls-panel">
                    <div class="row">
                        <div class="col-md-8">
                            <button class="control-btn btn-start" onclick="monitor.start()">
                                ▶️ Iniciar Monitor
                            </button>
                            <button class="control-btn btn-stop" onclick="monitor.stop()">
                                ⏹️ Detener
                            </button>
                            <button class="control-btn btn-clear" onclick="monitor.clearLogs()">
                                🗑️ Limpiar
                            </button>
                            <button class="control-btn btn-export" onclick="monitor.exportLogs()">
                                📥 Exportar
                            </button>
                        </div>
                        <div class="col-md-4">
                            <select id="log-level-filter" class="form-select" onchange="monitor.setLogFilter(this.value)">
                                <option value="">Todos los niveles</option>
                                <option value="DEBUG">Debug</option>
                                <option value="INFO">Info</option>
                                <option value="WARNING">Warning</option>
                                <option value="ERROR">Error</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="filter-controls">
                        <label class="form-check-label me-3">
                            <input type="checkbox" class="form-check-input" id="auto-scroll" checked>
                            Auto-scroll
                        </label>
                        <label class="form-check-label me-3">
                            <input type="checkbox" class="form-check-input" id="show-timestamps" checked>
                            Mostrar timestamps
                        </label>
                        <label class="form-check-label">
                            <input type="checkbox" class="form-check-input" id="show-modules" checked>
                            Mostrar módulos
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- Logs Container -->
            <div class="monitor-card">
                <div class="p-3">
                    <h5>📋 Logs en Tiempo Real</h5>
                    <div class="logs-container" id="logs-container">
                        <div class="log-entry info">
                            <span class="log-timestamp">[--:--:--]</span>
                            <span class="log-module">[system]</span>
                            <span class="log-message">Iniciando monitor integrado...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Activity Indicator -->
    <div class="activity-indicator activity-inactive" id="activity-indicator">
        🔴 Desconectado
    </div>

    <script>
        /**
         * 📡 MONITOR INTEGRADO - SIN SERVIDORES ADICIONALES
         * ================================================
         * 
         * Este monitor funciona completamente integrado con Django,
         * sin necesidad de servidores adicionales o WebSockets.
         * Usa polling inteligente para obtener logs en tiempo real.
         */
        
        class IntegratedMonitor {
            constructor() {
                this.isActive = false;
                this.pollInterval = 3000; // 3 segundos
                this.lastTimestamp = null;
                this.logs = [];
                this.maxLogs = 200;
                this.pollTimer = null;
                this.consecutiveErrors = 0;
                this.maxErrors = 5;
                
                this.initialize();
            }
            
            initialize() {
                console.log('📡 Inicializando Monitor Integrado...');
                this.updateConnectionStatus('connecting', 'Conectando...');
                
                // Agregar logs iniciales
                this.addSystemLog('Monitor integrado inicializado', 'info');
                this.addSystemLog('Sistema listo para recibir logs', 'success');
                
                // Iniciar automáticamente
                setTimeout(() => this.start(), 1000);
            }
            
            start() {
                if (this.isActive) return;
                
                this.isActive = true;
                this.consecutiveErrors = 0;
                this.updateConnectionStatus('connected', 'Conectado');
                this.updateActivityIndicator(true);
                
                this.addSystemLog('Monitor iniciado - Polling cada 3 segundos', 'info');
                this.poll();
            }
            
            stop() {
                this.isActive = false;
                this.updateConnectionStatus('disconnected', 'Desconectado');
                this.updateActivityIndicator(false);
                
                if (this.pollTimer) {
                    clearTimeout(this.pollTimer);
                    this.pollTimer = null;
                }
                
                this.addSystemLog('Monitor detenido por usuario', 'warning');
            }
            
            async poll() {
                if (!this.isActive) return;
                
                try {
                    const params = new URLSearchParams({
                        limit: '20',
                        since: this.lastTimestamp || ''
                    });
                    
                    const response = await fetch(`/dashboard/api/logs/?${params}`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Procesar nuevos logs
                        if (data.logs && data.logs.length > 0) {
                            data.logs.forEach(log => this.processLog(log));
                            this.lastTimestamp = data.timestamp;
                        }
                        
                        this.consecutiveErrors = 0;
                        this.updateConnectionStatus('connected', 'Conectado');
                        
                    } else {
                        throw new Error(data.error || 'Error desconocido');
                    }
                    
                } catch (error) {
                    this.consecutiveErrors++;
                    console.error('Error polling logs:', error);
                    
                    this.updateConnectionStatus('disconnected', `Error: ${error.message}`);
                    this.addSystemLog(`Error de conexión: ${error.message}`, 'error');
                    
                    if (this.consecutiveErrors >= this.maxErrors) {
                        this.addSystemLog(`Demasiados errores consecutivos (${this.consecutiveErrors}). Deteniendo monitor.`, 'error');
                        this.stop();
                        return;
                    }
                }
                
                // Continuar polling si está activo
                if (this.isActive) {
                    this.pollTimer = setTimeout(() => this.poll(), this.pollInterval);
                }
            }
            
            processLog(logData) {
                // Filtrar por nivel si está configurado
                const levelFilter = document.getElementById('log-level-filter')?.value;
                if (levelFilter && logData.level !== levelFilter) {
                    return;
                }
                
                // Agregar al array de logs
                this.logs.push(logData);
                
                // Mantener límite de logs
                if (this.logs.length > this.maxLogs) {
                    this.logs.shift();
                }
                
                // Mostrar en la interfaz
                this.displayLog(logData);
                
                // Actualizar estadísticas
                this.updateStats();
            }
            
            displayLog(logData) {
                const container = document.getElementById('logs-container');
                const logElement = document.createElement('div');
                
                // Determinar clase CSS basada en el nivel
                const levelClass = logData.level.toLowerCase();
                logElement.className = `log-entry ${levelClass}`;
                
                // Formatear timestamp
                const timestamp = new Date(logData.timestamp).toLocaleTimeString();
                
                // Construir contenido del log
                let content = '';
                
                if (document.getElementById('show-timestamps')?.checked) {
                    content += `<span class="log-timestamp">[${timestamp}]</span> `;
                }
                
                if (document.getElementById('show-modules')?.checked && logData.module) {
                    content += `<span class="log-module">[${logData.module}]</span> `;
                }
                
                content += `<span class="log-message">${logData.message}</span>`;
                
                logElement.innerHTML = content;
                
                // Agregar datos adicionales si existen
                if (logData.data) {
                    const dataElement = document.createElement('pre');
                    dataElement.style.marginLeft = '20px';
                    dataElement.style.fontSize = '10px';
                    dataElement.style.opacity = '0.7';
                    dataElement.style.color = '#888';
                    dataElement.textContent = JSON.stringify(logData.data, null, 2);
                    logElement.appendChild(dataElement);
                }
                
                // Agregar al contenedor
                container.appendChild(logElement);
                
                // Auto-scroll si está habilitado
                if (document.getElementById('auto-scroll')?.checked) {
                    container.scrollTop = container.scrollHeight;
                }
                
                // Mantener límite de elementos DOM
                while (container.children.length > this.maxLogs) {
                    container.removeChild(container.firstChild);
                }
            }
            
            addSystemLog(message, level = 'info') {
                const logData = {
                    timestamp: new Date().toISOString(),
                    level: level.toUpperCase(),
                    message: message,
                    module: 'monitor'
                };
                this.processLog(logData);
            }
            
            updateStats() {
                const totalLogs = this.logs.length;
                const errorCount = this.logs.filter(log => log.level === 'ERROR').length;
                const warningCount = this.logs.filter(log => log.level === 'WARNING').length;
                const successRate = totalLogs > 0 ? Math.round(((totalLogs - errorCount) / totalLogs) * 100) : 100;
                const lastUpdate = new Date().toLocaleTimeString();
                
                document.getElementById('total-logs').textContent = totalLogs;
                document.getElementById('error-count').textContent = errorCount;
                document.getElementById('success-rate').textContent = `${successRate}%`;
                document.getElementById('last-update').textContent = lastUpdate;
            }
            
            updateConnectionStatus(status, text) {
                const indicator = document.getElementById('connection-status');
                const textElement = document.getElementById('connection-text');
                
                // Limpiar clases anteriores
                indicator.classList.remove('connected', 'disconnected', 'connecting');
                
                // Agregar nueva clase
                indicator.classList.add(status);
                textElement.textContent = text;
            }
            
            updateActivityIndicator(active) {
                const indicator = document.getElementById('activity-indicator');
                
                if (active) {
                    indicator.className = 'activity-indicator activity-active';
                    indicator.textContent = '🟢 Activo';
                } else {
                    indicator.className = 'activity-indicator activity-inactive';
                    indicator.textContent = '🔴 Inactivo';
                }
            }
            
            clearLogs() {
                // Limpiar array de logs
                this.logs = [];
                
                // Limpiar contenedor visual
                const container = document.getElementById('logs-container');
                container.innerHTML = '';
                
                // Llamar al endpoint del servidor para limpiar cache
                fetch('/dashboard/api/logs/clear/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': this.getCSRFToken(),
                        'Content-Type': 'application/json'
                    }
                }).then(response => response.json())
                .then(data => {
                    if (data.success) {
                        this.addSystemLog('Logs limpiados correctamente', 'info');
                    } else {
                        this.addSystemLog(`Error limpiando logs: ${data.error}`, 'error');
                    }
                }).catch(error => {
                    this.addSystemLog(`Error limpiando logs: ${error.message}`, 'error');
                });
                
                this.updateStats();
            }
            
            setLogFilter(level) {
                // Re-renderizar logs con filtro
                const container = document.getElementById('logs-container');
                container.innerHTML = '';
                
                const filteredLogs = level ? 
                    this.logs.filter(log => log.level === level) : 
                    this.logs;
                    
                filteredLogs.forEach(log => this.displayLog(log));
                
                this.addSystemLog(`Filtro aplicado: ${level || 'Todos los niveles'}`, 'info');
            }
            
            exportLogs() {
                const exportData = {
                    timestamp: new Date().toISOString(),
                    total_logs: this.logs.length,
                    error_count: this.logs.filter(log => log.level === 'ERROR').length,
                    warning_count: this.logs.filter(log => log.level === 'WARNING').length,
                    logs: this.logs
                };
                
                const blob = new Blob([JSON.stringify(exportData, null, 2)], {
                    type: 'application/json'
                });
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `monitor-logs-${Date.now()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                this.addSystemLog('Logs exportados correctamente', 'success');
            }
            
            getCSRFToken() {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    const [name, value] = cookie.trim().split('=');
                    if (name === 'csrftoken') {
                        return value;
                    }
                }
                return '';
            }
        }
        
        // Inicializar monitor cuando se carga la página
        let monitor;
        
        document.addEventListener('DOMContentLoaded', function() {
            monitor = new IntegratedMonitor();
            window.monitor = monitor; // Hacer disponible globalmente
            
            console.log('📡 Monitor Integrado cargado y listo');
        });
        
        // Funciones helper para agregar logs desde otros scripts
        window.addLogToMonitor = function(message, level = 'info', module = 'external') {
            if (window.monitor) {
                window.monitor.addSystemLog(message, level);
            }
        };
        
        // Simular algunos logs para demostración
        setTimeout(() => {
            if (window.monitor) {
                monitor.addSystemLog('Sistema de verificación matemática cargado', 'success');
                monitor.addSystemLog('Tolerancia configurada: 0.01 MXN', 'info');
                monitor.addSystemLog('Listo para procesar scraping', 'success');
            }
        }, 3000);
        
        setTimeout(() => {
            if (window.monitor) {
                monitor.addSystemLog('Conectado a Django en puerto 8001', 'info');
                monitor.addSystemLog('Monitor integrado funcionando correctamente', 'success');
            }
        }, 6000);
    </script>
</body>
</html>
